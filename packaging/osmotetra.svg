<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>OsmoTetra</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bg)"/>

  <!-- Onde radio in uscita dall'antenna -->
  <g fill="none" stroke="#7fd1a6" stroke-linecap="round">
    <path d="M32 34 A 10 10 0 0 1 32 14" stroke-width="3" opacity="0.95"/>
    <path d="M32 34 A 10 10 0 0 0 32 14" stroke-width="3" opacity="0.95"/>
    <path d="M32 38 A 16 16 0 0 1 32 8"  stroke-width="2.5" opacity="0.6"/>
    <path d="M32 38 A 16 16 0 0 0 32 8"  stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Antenna e base -->
  <g stroke="#f7fafc" stroke-linecap="round">
    <line x1="32" y1="12" x2="32" y2="46" stroke-width="3.5"/>
    <line x1="22" y1="52" x2="42" y2="52" stroke-width="3.5"/>
    <line x1="32" y1="46" x2="24" y2="52" stroke-width="2.5"/>
    <line x1="32" y1="46" x2="40" y2="52" stroke-width="2.5"/>
  </g>
  <circle cx="32" cy="12" r="3.5" fill="#f6ad55"/>
